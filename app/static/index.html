<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BreezeBlue 账户管理</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- Login Page -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="logo">B</span>
      <div>
        <h1>BreezeBlue 账户管理</h1>
        <p>批量登录、自动签到与 API 中转</p>
      </div>
    </div>
    <form id="loginForm">
      <label>
        <span>用户名</span>
        <input id="lgUser" value="XIaoL" autocomplete="username">
      </label>
      <label>
        <span>密码</span>
        <div class="pass-wrap">
          <input id="lgPass" type="password" value="55588800qq" autocomplete="current-password">
          <button type="button" class="pass-toggle" id="togglePass" title="显示密码">👁</button>
        </div>
      </label>
      <button class="btn primary" type="submit">登录</button>
      <p class="hint" id="lgHint"></p>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="layout hidden">
  <aside class="sidebar">
    <div class="brand small">
      <span class="logo">B</span>
      <div><strong>BreezeBlue</strong><p>账户管理</p></div>
    </div>
    <nav id="nav">
      <a data-view="dash" class="active"><i>▤</i>概览</a>
      <a data-view="accounts"><i>♟</i>账户列表</a>
      <a data-view="relay"><i>⇄</i>API中转</a>
      <a data-view="logs"><i>≡</i>签到日志</a>
      <a data-view="backup"><i>⛨</i>数据备份</a>
    </nav>
    <div class="side-foot">
      <button class="btn ghost small" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h2 id="viewTitle">概览</h2><p id="viewSub">账户与签到状态</p></div>
      <div class="top-actions">
        <button class="btn ghost small" id="refreshBtn">刷新</button>
        <span class="clock" id="clock"></span>
      </div>
    </header>

    <section id="view-dash" class="view active">
      <div class="cards" id="statCards"></div>
      <div class="panel">
        <div class="panel-head"><h3>快速操作</h3></div>
        <div class="actions">
          <button class="btn primary" id="checkinAllBtn">全部签到</button>
          <button class="btn ghost" id="addAccountBtn">添加账户</button>
          <button class="btn ghost" id="backupDashBtn">立即备份</button>
        </div>
      </div>
    </section>

    <section id="view-accounts" class="view">
      <div class="panel">
        <div class="panel-head"><h3>账户列表</h3><button class="btn primary small" id="addAccountBtn2">+ 添加账户</button></div>
        <div class="table-wrap"><table id="accountTable"></table></div>
      </div>
    </section>

    <section id="view-relay" class="view">
      <div class="panel">
        <div class="panel-head"><h3>API 中转</h3></div>
        <div style="display:grid;gap:12px;padding:16px">
          <label style="display:block"><span>本地中转地址</span><input id="relayBase" value="/v1" readonly></label>
          <label style="display:block"><span>账户 ID</span><input id="relayAccount" value="1"></label>
          <label style="display:block"><span>接口路径</span><input id="relayPath" value="/v1/balance"></label>
          <label style="display:block"><span>方法</span><select id="relayMethod"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select></label>
          <label style="display:block"><span>JSON Body</span><textarea id="relayBody" rows="5" style="width:100%;min-height:110px">{}</textarea></label>
          <div class="actions"><button class="btn primary" id="sendRelayBtn">发送中转请求</button></div>
          <label style="display:block"><span>响应</span><textarea id="relayResponse" rows="10" style="width:100%;min-height:220px"></textarea></label>
        </div>
      </div>
    </section>

    <section id="view-logs" class="view">
      <div class="panel">
        <div class="panel-head"><h3>签到日志</h3><button class="btn ghost small" id="refreshLogsBtn">刷新</button></div>
        <div class="table-wrap"><table id="logTable"></table></div>
      </div>
    </section>

    <section id="view-backup" class="view">
      <div class="panel">
        <div class="panel-head"><h3>数据备份</h3><button class="btn primary small" id="backupNowBtn">立即备份</button></div>
        <div id="backupMeta" class="kv-list"></div>
        <div class="table-wrap"><table id="backupTable"></table></div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal-wrap hidden"><div class="modal" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
