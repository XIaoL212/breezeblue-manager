<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BreezeBlue 账户管理</title>
<style>
/* BreezeBlue Manager - Modern Dark Theme */
:root{
  --bg:#0b0f19; --bg2:#111725; --panel:#151c2c; --panel2:#1b2436; --line:#25304a;
  --txt:#e8edf7; --muted:#8b97b3; --accent:#4c8dff; --accent2:#22d3a6;
  --warn:#f5b544; --danger:#f2637e;
  --glow1:#16233f; --glow2:#122a2a;
  --radius:10px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
a{cursor:pointer;text-decoration:none;color:inherit}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--txt)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent);border-color:var(--danger)}
.btn.small{padding:6px 12px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);min-height:18px}
.hint.err{color:var(--danger)} .hint.ok{color:var(--accent2)}

/* Password toggle */
.pass-wrap{position:relative}
.pass-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
.pass-toggle:hover{color:var(--txt)}

/* Login Page */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1100px 500px at 20% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 500px at 100% 110%,var(--glow2) 0%,transparent 55%),var(--bg)}
.login-card{width:390px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 30px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brand .logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;font-size:20px;color:#04101f}
.brand h1{font-size:17px;font-weight:700}
.brand p{font-size:12px;color:var(--muted)}
.brand.small{margin-bottom:22px}
.brand.small .logo{width:34px;height:34px;border-radius:9px;font-size:16px}
.brand.small strong{font-size:14px} .brand.small p{font-size:11px}

/* Layout */
.layout{display:flex;min-height:100vh}
.sidebar{width:222px;flex:0 0 222px;background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#nav{display:flex;flex-direction:column;gap:4px;flex:1}
#nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);font-size:13.5px;transition:.15s}
#nav a i{font-style:normal;width:16px;text-align:center;font-size:14px}
#nav a:hover{background:var(--panel);color:var(--txt)}
#nav a.active{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--txt);box-shadow:inset 2px 0 0 var(--accent)}
.side-foot{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}

.main{flex:1;padding:22px 26px 40px;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.topbar h2{font-size:20px}
.topbar p{font-size:12.5px;color:var(--muted);margin-top:2px}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Views */
.view{display:none}.view.active{display:block}

/* Stat Cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
@media(max-width:800px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.card .label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.card .value{font-size:26px;font-weight:700;margin:8px 0 4px}
.card .foot{font-size:12px;color:var(--muted)}
.card .icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.card .icon.blue{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.card .icon.green{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.card .icon.yellow{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.panel-head h3{font-size:14px;font-weight:600}
.panel-body{padding:18px}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;font-size:13px}
th{background:var(--bg2);color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--panel2)}

/* Tags */
.tag{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11.5px;font-weight:600}
.tag.success{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.tag.danger{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.tag.warning{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* Modal */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10}
.modal{width:min(460px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h3{font-size:15px;margin-bottom:16px}
.modal label{margin-bottom:12px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:12px 22px;border-radius:10px;z-index:11;font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,.4);transition:.25s;opacity:0}
.toast.show{opacity:1}
</style>
</head>
<body>
<!-- Login Page -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="brand">
      <span class="logo">B</span>
      <div>
        <h1>BreezeBlue 账户管理</h1>
        <p>批量登录与自动签到</p>
      </div>
    </div>
    <form id="loginForm">
      <label>
        <span>用户名</span>
        <input id="lgUser" value="XIaoL" autocomplete="username">
      </label>
      <label>
        <span>密码</span>
        <div class="pass-wrap">
          <input id="lgPass" type="password" value="55588800qq" autocomplete="current-password">
          <button type="button" class="pass-toggle" id="togglePass" title="显示密码">👁</button>
        </div>
      </label>
      <button class="btn primary" type="submit">登录</button>
      <p class="hint" id="lgHint"></p>
    </form>
  </div>
</div>

<!-- Dashboard (shown after login) -->
<div id="dashboard" class="layout hidden">
  <aside class="sidebar">
    <div class="brand small">
      <span class="logo">B</span>
      <div><strong>BreezeBlue</strong><p>账户管理</p></div>
    </div>
    <nav id="nav">
      <a data-view="dash" class="active"><i>▤</i>概览</a>
      <a data-view="accounts"><i>♟</i>账户列表</a>
      <a data-view="logs"><i>≡</i>签到日志</a>
    </nav>
    <div class="side-foot">
      <button class="btn ghost small" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><h2 id="viewTitle">概览</h2><p id="viewSub">账户与签到状态</p></div>
      <div class="top-actions">
        <button class="btn ghost small" id="refreshBtn">刷新</button>
        <span class="clock" id="clock"></span>
      </div>
    </header>

    <!-- Dashboard View -->
    <section id="view-dash" class="view active">
      <div class="cards" id="statCards"></div>
      <div class="panel">
        <div class="panel-head"><h3>快速操作</h3></div>
        <div class="actions">
          <button class="btn primary" id="checkinAllBtn">全部签到</button>
          <button class="btn ghost" id="addAccountBtn">添加账户</button>
        </div>
      </div>
    </section>

    <!-- Accounts View -->
    <section id="view-accounts" class="view">
      <div class="panel">
        <div class="panel-head"><h3>账户列表</h3><button class="btn primary small" id="addAccountBtn2">+ 添加账户</button></div>
        <div class="table-wrap"><table id="accountTable"></table></div>
      </div>
    </section>

    <!-- Logs View -->
    <section id="view-logs" class="view">
      <div class="panel">
        <div class="panel-head"><h3>签到日志</h3><button class="btn ghost small" id="refreshLogsBtn">刷新</button></div>
        <div class="table-wrap"><table id="logTable"></table></div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal-wrap hidden"><div class="modal" id="modalBox"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const API="/api";
let token=localStorage.getItem("bb_token");

function toast(msg,cls){
  if(!cls) cls="";
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.className="toast show "+cls;
  setTimeout(function(){t.classList.remove("show");},2200);
}

async function api(path,opts){
  if(!opts) opts={};
  const h={"Content-Type":"application/json"};
  if(token) h.Authorization="Bearer "+token;
  const defaultOpts={headers:h,method:"GET"};
  Object.assign(defaultOpts,opts);
  const res=await fetch(API+path,defaultOpts);
  if(res.status===401){
    token=null;
    localStorage.removeItem("bb_token");
    showLogin();
    throw new Error("未登录或会话过期");
  }
  if(!res.ok){
    try{
      const body=await res.json();
      throw new Error(body.detail||res.statusText);
    }catch(e){
      throw new Error(res.statusText);
    }
  }
  return res.json();
}

function showLogin(){
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("dashboard").classList.add("hidden");
}

function showDashboard(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  switchView("dash");
}

// Password visibility toggle
document.getElementById("togglePass").addEventListener("click",function(){
  const input=document.getElementById("lgPass");
  const btn=document.getElementById("togglePass");
  if(input.type==="password"){
    input.type="text";
    btn.textContent="\\uD83D\\uDDE8";
    btn.title="\\u9690\\u85CF\\u5BC6\\u7801";
  }else{
    input.type="password";
    btn.textContent="\\uD83D\\uDC41";
    btn.title="\\u663E\\u793A\\u5BC6\\u7801";
  }
});

// Login
document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const user=document.getElementById("lgUser").value.trim();
  const pass=document.getElementById("lgPass").value.trim();
  const hint=document.getElementById("lgHint");
  hint.textContent="\\u767B\\u5F55\\u4E2D...";
  hint.className="hint";
  api("/login",{method:"POST",body:JSON.stringify({username:user,password:pass})})
    .then(function(data){
      token=data.token;
      localStorage.setItem("bb_token",token);
      showDashboard();
    })
    .catch(function(err){
      hint.textContent=err.message;
      hint.className="hint err";
    });
});

// Logout
document.getElementById("logoutBtn").addEventListener("click",function(){
  token=null;
  localStorage.removeItem("bb_token");
  showLogin();
});

// Navigation
document.getElementById("nav").addEventListener("click",function(e){
  const a=e.target.closest("a[data-view]");
  if(a) switchView(a.dataset.view);
});

function switchView(name){
  document.querySelectorAll("#nav a").forEach(function(a){
    a.classList.toggle("active",a.dataset.view===name);
  });
  document.querySelectorAll(".view").forEach(function(v){
    v.classList.toggle("active",v.id==="view-"+name);
  });
  if(name==="dash"){
    document.getElementById("viewTitle").textContent="\\u6982\\u89C8";
    document.getElementById("viewSub").textContent="\\u8D26\\u6237\\u4E0E\\u7B7E\\u5230\\u72B6\\u6001";
    loadStats();
  }else if(name==="accounts"){
    document.getElementById("viewTitle").textContent="\\u8D26\\u6237\\u5217\\u8868";
    document.getElementById("viewSub").textContent="\\u7BA1\\u7406\\u6240\\u6709 BreezeBlue \\u8D26\\u6237";
    loadAccounts();
  }else if(name==="logs"){
    document.getElementById("viewTitle").textContent="\\u7B7E\\u5230\\u65E5\\u5FD7";
    document.getElementById("viewSub").textContent="\\u6700\\u8FD1\\u7B7E\\u5230\\u8BB0\\u5F55";
    loadLogs();
  }
}

// Stats
async function loadStats(){
  try{
    const stats=await api("/stats");
    const html=""+
      '<div class="card"><div class="label"><span class="icon blue">\\u265F</span>\\u603B\\u8D26\\u6237\\u6570</div><div class="value">'+stats.account_count+'</div><div class="foot">\\u5DF2\\u914D\\u7F6E\\u8D26\\u6237</div></div>'+
      '<div class="card"><div class="label"><span class="icon green">\\u2605</span>\\u603B\\u79EF\\u5206</div><div class="value">'+stats.total_credits+'</div><div class="foot">\\u6240\\u6709\\u8D26\\u6237\\u79EF\\u5206\\u5408\\u8BA1</div></div>'+
      '<div class="card"><div class="label"><span class="icon yellow">\\u2713</span>\\u4ECA\\u65E5\\u7B7E\\u5230</div><div class="value">'+stats.today_checkins+'</div><div class="foot">\\u4ECA\\u65E5\\u6210\\u529F\\u7B7E\\u5230\\u6B21\\u6570</div></div>';
    document.getElementById("statCards").innerHTML=html;
  }catch(err){
    toast(err.message,"err");
  }
}

// Accounts
async function loadAccounts(){
  try{
    const accounts=await api("/accounts");
    if(accounts.length===0){
      document.getElementById("accountTable").innerHTML="<tr><td colspan='6' style='text-align:center;color:var(--muted);padding:30px'>\\u6682\\u65E0\\u8D26\\u6237</td></tr>";
      return;
    }
    let html="<thead><tr><th>ID</th><th>\\u7528\\u6237\\u540D</th><th>\\u72B6\\u6001</th><th>\\u79EF\\u5206</th><th>\\u4ECA\\u65E5\\u7B7E\\u5230</th><th>\\u64CD\\u4F5C</th></tr></thead><tbody>";
    for(const a of accounts){
      const statusTag=a.status==="active"?'<span class="tag success">\\u6B63\\u5E38</span>':'<span class="tag warning">\\u5F02\\u5E38</span>';
      const checkinTag=a.checked_in_today?'<span class="tag success">\\u5DF2\\u7B7E\\u5230</span>':'<span class="tag danger">\\u672A\\u7B7E\\u5230</span>';
      html+="<tr><td>"+a.id+"</td><td>"+a.email+"</td><td>"+statusTag+"</td><td>"+a.credits+"</td><td>"+checkinTag+"</td><td><button class=\"btn ghost small\" onclick=\"checkinAccount("+a.id+")\">\\u7B7E\\u5230</button> <button class=\"btn danger small\" onclick=\"deleteAccount("+a.id+")\">\\u5220\\u9664</button></td></tr>";
    }
    html+="</tbody>";
    document.getElementById("accountTable").innerHTML=html;
  }catch(err){
    toast(err.message,"err");
  }
}

async function checkinAccount(id){
  try{
    const result=await api("/accounts/"+id+"/checkin",{method:"POST",body:"{}"});
    toast("\\u7B7E\\u5230\\u6210\\u529F\\uff01\\u83B7\\u5F97 "+result.credits_earned+" \\u79EF\\u5206","ok");
    loadAccounts();
  }catch(err){
    toast(err.message,"err");
  }
}

async function deleteAccount(id){
  if(!confirm("\\u786E\\u5B9A\\u5220\\u9664\\u8FD9\\u4E2A\\u8D26\\u6237\\uff1F")) return;
  try{
    await api("/accounts/"+id,{method:"DELETE"});
    toast("\\u8D26\\u6237\\u5DF2\\u5220\\u9664","ok");
    loadAccounts();
  }catch(err){
    toast(err.message,"err");
  }
}

// Add Account
document.getElementById("addAccountBtn").addEventListener("click",showAddAccountModal);
document.getElementById("addAccountBtn2").addEventListener("click",showAddAccountModal);

async function showAddAccountModal(){
  const modal=document.getElementById("modal");
  modal.classList.remove("hidden");
  modal.querySelector("#modalBox").innerHTML=""+
    "<h3>\\u6DFB\\u52A0\\u8D26\\u6237</h3>"+
    "<form id='addAccountForm'>"+
    "<label><span>\\u7528\\u6237\\u540D</span><input name='username' required></label>"+
    "<label><span>\\u5BC6\\u7801</span><input name='password' type='password' required></label>"+
    "<label><span>Cookie</span><input name='cookie'></label>"+
    "<div class='actions'><button class='btn ghost' type='button' onclick='closeModal()'>\\u53D6\\u6D88</button> <button class='btn primary' type='submit'>\\u6DFB\\u52A0</button></div>"+
    "</form>";
  document.getElementById("addAccountForm").addEventListener("submit",function(e){
    e.preventDefault();
    const form=e.target;
    const data={
      username:form.username.value.trim(),
      password:form.password.value,
      cookie:form.cookie.value.trim()
    };
    api("/accounts",{method:"POST",body:JSON.stringify(data)})
      .then(function(){
        toast("\\u8D26\\u6237\\u6DFB\\u52A0\\u6210\\u529F","ok");
        closeModal();
        loadAccounts();
      })
      .catch(function(err){
        toast(err.message,"err");
      });
  });
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

// Logs
async function loadLogs(){
  try{
    const logs=await api("/logs");
    if(logs.length===0){
      document.getElementById("logTable").innerHTML="<tr><td colspan='5' style='text-align:center;color:var(--muted);padding:30px'>\\u6682\\u65E0\\u7B7E\\u5230\\u65E5\\u5FD7</td></tr>";
      return;
    }
    let html="<thead><tr><th>\\u65F6\\u95F4</th><th>\\u7528\\u6237\\u540D</th><th>\\u72B6\\u6001</th><th>\\u79EF\\u5206\\u53D8\\u5316</th><th>\\u6D88\\u606F</th></tr></thead><tbody>";
    for(const l of logs){
      const statusTag=l.success?'<span class="tag success">\\u6210\\u529F</span>':'<span class="tag danger">\\u5931\\u8D25</span>';
      html+="<tr><td>"+l.ts+"</td><td>"+l.account_email+"</td><td>"+statusTag+"</td><td>+"+l.credits_earned+"</td><td>"+l.message+"</td></tr>";
    }
    html+="</tbody>";
    document.getElementById("logTable").innerHTML=html;
  }catch(err){
    toast(err.message,"err");
  }
}

// Checkin All
document.getElementById("checkinAllBtn").addEventListener("click",async function(){
  try{
    const result=await api("/checkin/all",{method:"POST",body:"{}"});
    toast("\\u5168\\u90E8\\u7B7E\\u5230\\u5B8C\\u6210\\uff1a\\u6210\\u529F "+result.success+"\\uff0c\\u5931\\u8D25 "+result.failed,"ok");
    loadStats();
    loadAccounts();
  }catch(err){
    toast(err.message,"err");
  }
});

// Refresh
document.getElementById("refreshBtn").addEventListener("click",function(){
  const activeView=document.querySelector("#nav a.active");
  if(activeView) switchView(activeView.dataset.view);
});

document.getElementById("refreshLogsBtn").addEventListener("click",loadLogs);

// Clock
function updateClock(){
  const now=new Date();
  document.getElementById("clock").textContent=now.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

// Initial state
if(token){
  showDashboard();
}else{
  showLogin();
}
</script>
</body>
</html>
